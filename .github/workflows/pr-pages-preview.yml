name: PR Cloudflare Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: ${{ github.event.repository.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate Cloudflare config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_PROJECT_NAME:-}" ]]; then
            echo "::error::Missing repository variable CLOUDFLARE_PROJECT_NAME."
            exit 1
          fi

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          persist-credentials: false
          path: source

      - name: Prepare static site
        run: |
          set -euo pipefail

          mkdir site
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".idea" \
            "source/" "site/"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_PROJECT_NAME }}.pages.dev
        with:
          script: |
            const marker = '<!-- pr-cloudflare-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const previewUrl = process.env.PREVIEW_URL;
            const body = [
              marker,
              '\u2705 PR \u9884\u89c8\u9875\u9762\u5df2\u90e8\u7f72\u5230 Cloudflare Pages\u3002',
              '',
              `\u6d4b\u8bd5\u94fe\u63a5\uff1a${previewUrl}`,
              '',
              '\u26a0\ufe0f \u8fd9\u662f\u672a\u5ba1\u6838 PR \u7684\u9884\u89c8\u9875\u9762\uff0c\u8bf7\u4e0d\u8981\u8f93\u5165\u4efb\u4f55\u654f\u611f\u4fe1\u606f\u3002',
              '',
              '\u672c\u8bc4\u8bba\u4f1a\u5728\u540e\u7eed PR \u66f4\u65b0\u540e\u81ea\u52a8\u5237\u65b0\u3002',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
